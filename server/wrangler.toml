#
# Cloudflare Workers config for the free (무인) AI proxy variant (worker.js).
# Deploy: see server/README.md. The API key is a SECRET, never a var here:
#     wrangler secret put ANTHROPIC_API_KEY
# NEVER put the key in this file or in [vars].

name = "e-contract-ai"
main = "worker.js"
compatibility_date = "2024-09-23"

# Non-secret configuration only. The key is set with `wrangler secret put`.
[vars]
ALLOWED_ORIGIN = "https://clsoftlab-lang.github.io"
AI_MODEL = "claude-haiku-4-5"   # raise to claude-sonnet-5 / claude-opus-5 for higher quality
AI_EFFORT = "low"
