name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check all JS modules
        run: |
          node --check app.js
          node --check check.mjs
          for f in modules/*.js; do echo "checking $f"; node --check "$f"; done

      - name: Run validator and unit tests
        run: node check.mjs
